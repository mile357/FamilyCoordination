services:
  family-hub:
    build:
      context: .
      dockerfile: Dockerfile
    image: family-hub:latest
    container_name: family-hub
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # Persists SQLite database (hub.db) on host filesystem
      - ./data:/app/data
    environment:
      - PORT=8080
      - TZ=America/Los_Angeles # Change to your local timezone
