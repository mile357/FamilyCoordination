<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>grocery list — family hub</title>
  <meta name="theme-color" content="#000000" />
  <link rel="stylesheet" href="/styles.css?v=42" />
  <script>
    (function () {
      try {
        var raw = localStorage.getItem("hub_active_theme_cache_v1");
        if (!raw) return;
        var cached = JSON.parse(raw);
        if (!cached || typeof cached !== "object") return;
        if (cached.themeId && /^[a-z0-9][a-z0-9_-]*$/.test(cached.themeId)) {
          document.documentElement.setAttribute("data-theme-id", cached.themeId);
        }
        if (cached.mode === "light" || cached.mode === "dark") {
          document.documentElement.setAttribute("data-theme", cached.mode);
        }
        if (cached.accent && /^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/.test(cached.accent)) {
          document.documentElement.style.setProperty("--accent", cached.accent);
        }
        if (cached.stylesheetUrl && /^\/themes\/[a-zA-Z0-9._\/-]+\.css$/.test(cached.stylesheetUrl)) {
          var link = document.createElement("link");
          link.id = "activeThemeStylesheet";
          link.rel = "stylesheet";
          link.href = cached.stylesheetUrl + "?v=42";
          document.head.appendChild(link);
        }
      } catch (e) {}
    })();
  </script>
  <style>
    body {
      overflow-y: auto;
      padding: 20px 18px 48px 18px;
      max-width: 540px;
      margin: 0 auto;
    }
    .pocket-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 6px;
    }
    .pocket-title {
      font-family: var(--font-display);
      font-size: 38px;
      font-weight: var(--title-weight, 200);
      letter-spacing: var(--title-tracking, -0.02em);
      line-height: 1.05;
      text-transform: var(--title-transform, lowercase);
      color: var(--text-primary);
    }
    .pocket-status {
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--slot-accent, var(--success-color, #60A917));
      display: inline-block;
    }
    .status-dot.offline {
      background: var(--warning-color, #F0A30A);
    }
    .pocket-actions {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>
  <header class="pocket-header">
    <h1 class="pocket-title">grocery list</h1>
    <button class="metro-btn accent" style="--accent:var(--slot-accent, #60A917); --accent-fg:var(--slot-accent-fg, #FFFFFF); padding:6px 12px; font-size:13px;" id="btnCopyNotes">
      copy for notes
    </button>
  </header>

  <div class="pocket-status" id="syncStatus">
    <span class="status-dot" id="statusDot"></span>
    <span id="statusText">connecting to family hub...</span>
  </div>

  <div class="quick-form" style="margin-bottom:14px;">
    <input class="metro-input" id="mobileGrocInput" placeholder="add grocery item..." autocomplete="off" />
    <button class="metro-btn accent" style="--accent:var(--slot-accent, #60A917); --accent-fg:var(--slot-accent-fg, #FFFFFF)" id="btnMobileAdd">add</button>
    <button class="metro-btn subtle" id="btnMobileClear" style="display:none;">clear</button>
  </div>

  <div class="metro-list" id="mobileGrocList"></div>

  <div class="toast-banner" id="mobileToast"></div>

  <script>
    const CACHE_KEY = "metro_pocket_groceries_v1";
    const DIRTY_KEY = "metro_pocket_dirty_v1";
    const THEME_KEY = "hub_active_theme_cache_v1";
    const LEGACY_THEME_KEY = "metro_pocket_theme_v1";
    const THEME_ASSET_VERSION = "39";
    let groceries = [];
    let isOnlineWithHub = false;
    let isSyncing = false;
    let syncPending = false;
    let pocketThemesCache = null;

    function sanitizeHexColor(val, fallback) {
      const s = String(val || "").trim();
      return /^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/.test(s) ? s : fallback;
    }

    function getPocketContrastColor(hex) {
      let clean = sanitizeHexColor(hex, "#60A917").slice(1);
      if (clean.length === 3) clean = clean.split("").map((c) => c + c).join("");
      const r = parseInt(clean.slice(0, 2), 16);
      const g = parseInt(clean.slice(2, 4), 16);
      const b = parseInt(clean.slice(4, 6), 16);
      const yiq = (r * 299 + g * 587 + b * 114) / 1000;
      const toLin = (c) => {
        const s = c / 255;
        return s <= 0.03928 ? s / 12.92 : Math.pow((s + 0.055) / 1.055, 2.4);
      };
      const lum = 0.2126 * toLin(r) + 0.7152 * toLin(g) + 0.0722 * toLin(b);
      const whiteContrast = 1.05 / (lum + 0.05);
      return whiteContrast >= 2.8 && yiq < 155 ? "#FFFFFF" : "#000000";
    }

    async function ensurePocketThemesLoaded() {
      if (pocketThemesCache) return pocketThemesCache;
      try {
        const res = await fetch("/api/themes", { cache: "no-store" });
        if (res.ok) {
          const data = await res.json();
          if (data && Array.isArray(data.themes)) {
            pocketThemesCache = data.themes;
            return pocketThemesCache;
          }
        }
      } catch (e) {}
      return [];
    }

    async function applyPocketThemeFromSettings(settings) {
      const s = settings || {};
      const themes = await ensurePocketThemesLoaded();
      const rawId = s.themeId || "metro";
      const themeDef = themes.find((t) => t.id === rawId) || themes.find((t) => t.id === "metro") || null;
      const allowedModes = themeDef && Array.isArray(themeDef.modes) && themeDef.modes.length > 0 ? themeDef.modes : ["dark", "light"];
      const mode = allowedModes.includes(s.theme) ? s.theme : ((themeDef && themeDef.defaultMode) || allowedModes[0]);
      const accent = sanitizeHexColor(s.accentColor, (themeDef && themeDef.defaultAccent) || "#00ABA9");
      const slotAccent = sanitizeHexColor(
        (themeDef && themeDef.extensionAccents && themeDef.extensionAccents.groceries) ||
          (themeDef && themeDef.id === "metro" ? "#60A917" : accent),
        "#60A917"
      );
      const stylesheetUrl = (themeDef && themeDef.stylesheetUrl) || "";
      const metaColor = (themeDef && themeDef.metaThemeColor && themeDef.metaThemeColor[mode]) || (mode === "light" ? "#FFFFFF" : "#000000");

      applyPocketResolvedTheme({
        themeId: (themeDef && themeDef.id) || rawId || "metro",
        mode,
        accent,
        slotAccent,
        stylesheetUrl,
        metaColor,
      });
    }

    function applyPocketResolvedTheme(info) {
      if (!info) return;
      const mode = info.mode === "light" ? "light" : "dark";
      const themeId = info.themeId && /^[a-z0-9][a-z0-9_-]*$/.test(info.themeId) ? info.themeId : "metro";
      const accent = sanitizeHexColor(info.accent, "#00ABA9");
      const slotAccent = sanitizeHexColor(info.slotAccent, "#60A917");

      document.documentElement.setAttribute("data-theme-id", themeId);
      document.documentElement.setAttribute("data-theme", mode);
      document.documentElement.style.setProperty("--accent", accent);
      document.documentElement.style.setProperty("--accent-fg", getPocketContrastColor(accent));
      document.documentElement.style.setProperty("--slot-accent", slotAccent);
      document.documentElement.style.setProperty("--slot-accent-fg", getPocketContrastColor(slotAccent));

      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta && info.metaColor) meta.setAttribute("content", info.metaColor);

      const existingLink = document.getElementById("activeThemeStylesheet");
      const targetHref = info.stylesheetUrl ? `${info.stylesheetUrl}?v=${THEME_ASSET_VERSION}` : "";
      if (targetHref && /^\/themes\/[a-zA-Z0-9._\/-]+\.css\?v=/.test(targetHref)) {
        if (existingLink) {
          if (existingLink.getAttribute("href") !== targetHref) {
            existingLink.setAttribute("href", targetHref);
          }
        } else {
          const link = document.createElement("link");
          link.id = "activeThemeStylesheet";
          link.rel = "stylesheet";
          link.href = targetHref;
          document.head.appendChild(link);
        }
      } else if (existingLink) {
        existingLink.remove();
      }

      try {
        localStorage.setItem(THEME_KEY, JSON.stringify({ ...info, themeId, mode, accent, slotAccent }));
        localStorage.setItem(LEGACY_THEME_KEY, mode);
      } catch (e) {}
    }

    function showMobileToast(msg) {
      const el = document.getElementById("mobileToast");
      el.textContent = msg;
      el.classList.add("visible");
      clearTimeout(el._t);
      el._t = setTimeout(() => el.classList.remove("visible"), 2200);
    }

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function loadInitialSeedFromHashOrCache() {
      try {
        const cachedTheme = localStorage.getItem(THEME_KEY);
        if (cachedTheme) {
          applyPocketResolvedTheme(JSON.parse(cachedTheme));
        } else {
          const legacyTheme = localStorage.getItem(LEGACY_THEME_KEY);
          if (legacyTheme === "light" || legacyTheme === "dark") {
            document.documentElement.setAttribute("data-theme", legacyTheme);
          }
        }
        const cached = localStorage.getItem(CACHE_KEY);
        if (cached) {
          groceries = JSON.parse(cached) || [];
        }
      } catch (e) {}

      if (groceries.length === 0 && location.hash.startsWith("#items=")) {
        try {
          const raw = decodeURIComponent(location.hash.slice("#items=".length));
          const names = raw.split("\n").map((s) => s.trim()).filter(Boolean);
          groceries = names.map((name, i) => ({
            id: "hash-" + i,
            name: name.replace(/^[•\-*]\s*/, ""),
            checked: false,
            fromMeal: null,
          }));
          saveLocalCache(false);
        } catch (e) {}
      }
    }

    function saveLocalCache(markDirty = true) {
      try {
        localStorage.setItem(CACHE_KEY, JSON.stringify(groceries));
        if (markDirty) {
          localStorage.setItem(DIRTY_KEY, "1");
        }
      } catch (e) {}
    }

    function setSyncIndicator(online, text) {
      isOnlineWithHub = online;
      const dot = document.getElementById("statusDot");
      const label = document.getElementById("statusText");
      dot.className = "status-dot" + (online ? "" : " offline");
      label.textContent = text;
    }

    async function syncWithHub() {
      if (isSyncing) {
        syncPending = true;
        return;
      }
      isSyncing = true;
      try {
        const res = await fetch("/api/state", { cache: "no-store" });
        if (!res.ok) throw new Error("Hub unreachable");
        const state = await res.json();

        if (state && state.settings) {
          await applyPocketThemeFromSettings(state.settings);
        }

        const hasDirtyLocal = localStorage.getItem(DIRTY_KEY) === "1";
        if (hasDirtyLocal) {
          const snapshotJson = JSON.stringify(groceries);
          const groceriesToPush = JSON.parse(snapshotJson);
          state.groceries = groceriesToPush;

          let postRes = await fetch("/api/state", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "X-Expected-Updated-At": state._updatedAt || "",
            },
            body: JSON.stringify(state),
          });

          if (postRes.status === 409) {
            const conflictData = await postRes.json();
            const latestState = (conflictData && conflictData.state) || state;
            if (latestState && latestState.settings) {
              await applyPocketThemeFromSettings(latestState.settings);
            }
            latestState.groceries = groceriesToPush;
            postRes = await fetch("/api/state", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "X-Expected-Updated-At": latestState._updatedAt || "",
              },
              body: JSON.stringify(latestState),
            });
          }

          if (postRes.ok) {
            if (JSON.stringify(groceries) === snapshotJson) {
              localStorage.removeItem(DIRTY_KEY);
            } else {
              syncPending = true;
            }
          }
        } else if (Array.isArray(state.groceries)) {
          groceries = state.groceries;
          saveLocalCache(false);
        }

        setSyncIndicator(true, "synced with kitchen hub (cached for store)");
        renderList();
      } catch (e) {
        setSyncIndicator(
          false,
          "offline store mode — check-offs saved on phone & sync when back on home wi-fi"
        );
        renderList();
      } finally {
        isSyncing = false;
        if (syncPending) {
          syncPending = false;
          syncWithHub();
        }
      }
    }

    async function pushChangeToHub() {
      saveLocalCache(true);
      renderList();
      await syncWithHub();
    }

    function renderList() {
      const listEl = document.getElementById("mobileGrocList");
      const clearBtn = document.getElementById("btnMobileClear");
      listEl.innerHTML = "";

      const checkedCount = groceries.filter((g) => g.checked).length;
      if (checkedCount > 0) {
        clearBtn.style.display = "inline-flex";
        clearBtn.textContent = `clear (${checkedCount})`;
      } else {
        clearBtn.style.display = "none";
      }

      const sorted = [...groceries].sort((a, b) => Number(a.checked) - Number(b.checked));
      if (sorted.length === 0) {
        listEl.innerHTML = `<div class="agenda-empty" style="padding:18px; background:var(--bg-tile);">grocery list is empty</div>`;
        return;
      }

      sorted.forEach((item) => {
        const row = document.createElement("div");
        row.className = "metro-list-item";
        row.innerHTML = `
          <div class="check-row" role="checkbox" aria-checked="${Boolean(item.checked)}" tabindex="0">
            <div class="metro-checkbox ${item.checked ? "checked" : ""}">${item.checked ? "✓" : ""}</div>
            <div class="item-text-wrap">
              <span class="item-primary ${item.checked ? "checked-text" : ""}">${escapeHtml(item.name)}</span>
              ${
                item.fromMeal
                  ? `<span class="item-secondary">from meal: ${escapeHtml(item.fromMeal)}</span>`
                  : ""
              }
            </div>
          </div>
          <button class="slot-icon-btn" title="Delete">✕</button>
        `;

        const checkRow = row.querySelector(".check-row");
        const toggleItem = () => {
          item.checked = !item.checked;
          pushChangeToHub();
        };
        checkRow.addEventListener("click", toggleItem);
        checkRow.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            toggleItem();
          }
        });

        row.querySelector("button").addEventListener("click", () => {
          groceries = groceries.filter((g) => g.id !== item.id);
          pushChangeToHub();
        });

        listEl.appendChild(row);
      });
    }

    document.getElementById("btnMobileAdd").addEventListener("click", () => {
      const inp = document.getElementById("mobileGrocInput");
      const val = inp.value.trim();
      if (!val) return;
      groceries.unshift({
        id: "groc-" + Date.now() + "-" + Math.random().toString(36).slice(2, 6),
        name: val,
        checked: false,
        fromMeal: null,
      });
      inp.value = "";
      pushChangeToHub();
    });

    document.getElementById("mobileGrocInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") document.getElementById("btnMobileAdd").click();
      if (e.key === "Escape") {
        e.target.value = "";
        e.target.blur();
      }
    });

    document.getElementById("btnMobileClear").addEventListener("click", () => {
      groceries = groceries.filter((g) => !g.checked);
      pushChangeToHub();
    });

    document.getElementById("btnCopyNotes").addEventListener("click", async () => {
      const unchecked = groceries.filter((g) => !g.checked);
      const listToCopy = (unchecked.length > 0 ? unchecked : groceries)
        .map((g) => `• ${g.name}`)
        .join("\n");
      try {
        await navigator.clipboard.writeText(listToCopy);
        showMobileToast("Copied grocery list to clipboard!");
      } catch (e) {
        const ta = document.createElement("textarea");
        ta.value = listToCopy;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        ta.remove();
        showMobileToast("Copied grocery list to clipboard!");
      }
    });

    loadInitialSeedFromHashOrCache();
    renderList();
    syncWithHub();
    window.addEventListener("online", syncWithHub);
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") syncWithHub();
    });
    setInterval(syncWithHub, 15000);
  </script>
</body>
</html>
