<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="family hub" />
  <title>family hub</title>
  <link rel="manifest" href="/manifest.json?v=40" />
  <link rel="icon" type="image/svg+xml" href="/icon.svg?v=40" />
  <link rel="apple-touch-icon" href="/icon-192.png?v=40" />
  <link rel="stylesheet" href="/styles.css?v=40" />
  <script>
    (function () {
      try {
        var raw = localStorage.getItem("hub_active_theme_cache_v1");
        if (!raw) return;
        var cached = JSON.parse(raw);
        if (!cached || typeof cached !== "object") return;
        if (cached.themeId && /^[a-z0-9][a-z0-9_-]*$/.test(cached.themeId)) {
          document.documentElement.setAttribute("data-theme-id", cached.themeId);
        }
        if (cached.mode === "light" || cached.mode === "dark") {
          document.documentElement.setAttribute("data-theme", cached.mode);
        }
        if (cached.accent && /^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/.test(cached.accent)) {
          document.documentElement.style.setProperty("--accent", cached.accent);
        }
        if (cached.metaColor) {
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", cached.metaColor);
        }
        if (cached.stylesheetUrl && /^\/themes\/[a-zA-Z0-9._\/-]+\.css$/.test(cached.stylesheetUrl)) {
          var link = document.createElement("link");
          link.id = "activeThemeStylesheet";
          link.rel = "stylesheet";
          link.href = cached.stylesheetUrl + "?v=40";
          document.head.appendChild(link);
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <!-- TOP PANORAMA HEADER -->
  <header class="panorama-header">
    <div class="panorama-brand">
      <h1 class="panorama-title" id="hubTitle">family hub</h1>
      <span class="panorama-subtitle" id="hubWeather" title="Current local weather"></span>
    </div>

    <div class="panorama-status" id="headerSettingsTrigger" title="Open Settings" role="button" tabindex="0">
      <div class="clock-group">
        <span class="clock-date" id="clockDate">tuesday, nov 3</span>
        <span class="clock-time" id="clockTime">10:45</span>
      </div>
      <div class="header-actions">
        <button class="metro-ellipsis-btn global-ellipsis" id="btnSettings" title="Settings & Extensions" aria-label="Settings & Extensions">
          <svg class="ellipsis-dots-svg" viewBox="0 0 18 4" aria-hidden="true">
            <circle cx="2" cy="2" r="1.75" fill="currentColor" />
            <circle cx="9" cy="2" r="1.75" fill="currentColor" />
            <circle cx="16" cy="2" r="1.75" fill="currentColor" />
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- HORIZONTAL METRO PANORAMA STAGE -->
  <main class="panorama-viewport" id="panoramaStage">
    <!-- Columns are rendered dynamically by the Extension Host -->
  </main>

  <!-- FLYOUT DRAWER FOR EXTENSIONS, CALENDARS, AND ADDING COLUMNS -->
  <div class="flyout-backdrop" id="flyoutBackdrop">
    <aside class="metro-flyout" id="flyoutPanel">
      <!-- Dynamic flyout content -->
    </aside>
  </div>

  <!-- METRO NOTIFICATION TOAST -->
  <div class="toast-banner" id="toastBanner"></div>

  <script type="module" src="/app.js?v=40"></script>
</body>
</html>
