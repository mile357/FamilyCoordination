<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="family hub" />
  <title>family hub — metro panorama</title>
  <link rel="manifest" href="/manifest.json?v=38" />
  <link rel="icon" type="image/svg+xml" href="/icon.svg?v=38" />
  <link rel="apple-touch-icon" href="/icon-192.png?v=38" />
  <link rel="stylesheet" href="/styles.css?v=38" />
</head>
<body>
  <!-- TOP PANORAMA HEADER -->
  <header class="panorama-header">
    <div class="panorama-brand">
      <h1 class="panorama-title" id="hubTitle">family hub</h1>
      <span class="panorama-subtitle" id="hubWeather" title="Current local weather"></span>
    </div>

    <div class="panorama-status" id="headerSettingsTrigger" title="Open Settings" role="button" tabindex="0">
      <div class="clock-group">
        <span class="clock-date" id="clockDate">tuesday, nov 3</span>
        <span class="clock-time" id="clockTime">10:45</span>
      </div>
      <div class="header-actions">
        <button class="metro-ellipsis-btn global-ellipsis" id="btnSettings" title="Settings & Extensions">•••</button>
      </div>
    </div>
  </header>

  <!-- HORIZONTAL METRO PANORAMA STAGE -->
  <main class="panorama-viewport" id="panoramaStage">
    <!-- Columns are rendered dynamically by the Extension Host -->
  </main>

  <!-- FLYOUT DRAWER FOR EXTENSIONS, CALENDARS, AND ADDING COLUMNS -->
  <div class="flyout-backdrop" id="flyoutBackdrop">
    <aside class="metro-flyout" id="flyoutPanel">
      <!-- Dynamic flyout content -->
    </aside>
  </div>

  <!-- METRO NOTIFICATION TOAST -->
  <div class="toast-banner" id="toastBanner"></div>

  <script type="module" src="/app.js?v=38"></script>
</body>
</html>
